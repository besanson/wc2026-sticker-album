[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchsim"
version = "0.1.0"
description = "Tiered match simulator for Udinese vs Cagliari (Serie A, 2026-09-19)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "statsmodels==0.14.6",
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "socceraction==1.5.3",
    "statsbombpy==1.12.0",
    "typer==0.15.4",
    "pyyaml==6.0.3",
    "matplotlib==3.9.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.1.0"]

[project.scripts]
matchsim = "matchsim.cli:app"

[tool.setuptools.packages.find]
include = ["matchsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
